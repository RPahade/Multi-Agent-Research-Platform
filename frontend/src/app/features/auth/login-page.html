<div class="wrap">
  <form class="card box" [formGroup]="form" (ngSubmit)="submit()">
    <div class="brand">
      <span class="brand-mark">MA</span>
      <span class="brand-text">Research Intelligence</span>
    </div>

    <h1>Sign in</h1>

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }

    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        [class.invalid]="showError('email')"
      />
      @if (showError('email')) {
        <span class="field-error">Enter a valid email address.</span>
      }
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [class.invalid]="showError('password')"
      />
      @if (showError('password')) {
        <span class="field-error">Password is required.</span>
      }
    </div>

    <button class="btn btn-primary full" type="submit" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="muted note">
      <small>
        No account? Accounts are created by an administrator — there is no
        self-service sign-up.
      </small>
    </p>
  </form>
</div>
