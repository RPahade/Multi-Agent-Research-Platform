<div class="shell">
  <aside class="sidebar" [class.open]="menuOpen()">
    <div class="brand">
      <span class="brand-mark">MA</span>
      <span class="brand-text">Research Intelligence</span>
    </div>

    <nav>
      @for (link of links(); track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="menu-btn" type="button" (click)="toggleMenu()">☰</button>
      <span class="spacer"></span>

      @if (auth.user(); as user) {
        <span class="who">
          <span class="name">{{ user.full_name || user.email }}</span>
          <span class="badge">{{ user.role }}</span>
        </span>
        <button class="btn" type="button" (click)="signOut()" [disabled]="signingOut()">
          {{ signingOut() ? 'Signing out…' : 'Sign out' }}
        </button>
      }
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
